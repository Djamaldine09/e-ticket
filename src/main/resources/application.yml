spring:
  application:
    name: ticket-place

  # Configuration BDD
  datasource:
    # Utilise DB_URL en production (Render/Railway) et permet une valeur explicite en local
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticket_place?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Crée/met à jour les tables automatiquement
    show-sql: true      # Affiche les requêtes SQL en console
    properties:
      hibernate:
        format_sql: true

  # Jackson : format des dates en JSON
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: false
    time-zone: UTC

# Configuration du serveur
server:
  # Render fournit PORT en production ; 8080 reste le port par défaut en local
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Configuration JWT
app:
  jwt:
    secret: ${JWT_SECRET:ticket-place-secret-key-must-be-at-least-32-chars-long}
    expiration: 86400000   # 24 heures en millisecondes
  upload:
    dir: uploads
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

# Logs
logging:
  level:
    com.insi.ticketplace: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
