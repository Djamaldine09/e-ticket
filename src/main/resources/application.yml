spring:
  application:
    name: ticket-place

  # Configuration BDD
  datasource:
    # Utilise DB_URL en production (Render/Railway) et permet une valeur explicite en local
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticket_place?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Pool Hikari robuste pour une base MySQL distante (Aiven/Render)
    hikari:
      # Évite de bloquer une requête pendant plusieurs minutes si MySQL est indisponible
      connection-timeout: 10000
      validation-timeout: 5000
      # Maintient les connexions actives lorsque le fournisseur coupe les connexions inactives
      keepalive-time: 120000
      # Renouvelle les connexions avant leur expiration côté serveur
      max-lifetime: 1500000
      # Ne crée pas un grand nombre de connexions simultanées sur une petite instance
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 1
      data-source-properties:
        tcpKeepAlive: true
        useUnicode: true
        characterEncoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Le dialect est explicite car la BDD distante peut être temporairement inaccessible au démarrage.
        # Cela évite que Hibernate échoue avant même que Hikari puisse rétablir la connexion.
        dialect: org.hibernate.dialect.MySQLDialect

  # Jackson : format des dates en JSON
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: false
    time-zone: UTC

# Configuration du serveur
server:
  # Render fournit PORT en production ; 8080 reste le port par défaut en local
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Configuration JWT
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

# Configuration Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

# Logs
logging:
  level:
    com.insi.ticketplace: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
